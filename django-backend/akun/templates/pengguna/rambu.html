{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Jenis Rambu - Kamera Pintar</title>
    <link rel="stylesheet" href="{% static 'main/artikel.css' %}">
</head>
<body>
    <header class="navbar">
        <div class="logo">Kamera Pintar</div>
        <nav>
            <a href="{% url 'home' %}">Dashboard</a>
            <a href="{% url 'history_pengguna' %}">History Pelanggaran</a>

            <a href="{% url 'logout' %}">Logout</a>
        </nav>
    </header>

     <div class="judul-dengan-gambar">

    </div>

    <section class="rambu-container">

</div>
        {% endfor %}
    </section>
</body>
</html>
