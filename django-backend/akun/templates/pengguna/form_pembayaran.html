{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Unggah Bukti Pembayaran</title>
</head>
<body>
    <h2>Unggah Bukti Pembayaran</h2>

    <p>Lokasi Pelanggaran: {{ pelanggaran.lokasi }}</p>
    <p>Waktu: {{ pelanggaran.waktu }}</p>
    <p>Plat Nomor: {{ pelanggaran.plat_nomor }}</p>
    <p><strong>Jumlah Denda: Rp {{ pelanggaran.jumlah_denda }}</strong></p>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <label for="bukti_pembayaran">Upload Bukti Pembayaran:</label><br>
        <input type="file" name="bukti_pembayaran" accept="image/*" required><br><br>
        <button type="submit">Kirim</button>
    </form>
</body>
{% include "partials/footer.html" %}
</html>
