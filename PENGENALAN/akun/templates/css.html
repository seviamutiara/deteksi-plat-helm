{% load static %}

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
        }

        .login-left, .login-right {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-left {
            background-color: #ffffff;
            flex-direction: column;
            padding: 40px;
        }

        .login-left img.icon {
            width: 80px;
            margin-bottom: 20px;
        }

        .login-left input {
            width: 100%;
            padding: 12px 20px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 12px;
        }

        .login-left a {
            color: #888;
            font-size: 14px;
            text-decoration: none;
            margin-top: 5px;
        }

        .login-left button {
            margin-top: 20px;
            padding: 12px;
            width: 100%;
            background-color: #53b1a6;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .login-right {
            background-color: #151233;
            color: white;
            flex-direction: column;
            text-align: center;
            padding: 20px;
        }

        .login-right img {
            width: 200px;
            margin-bottom: 20px;
        }

        .login-right h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .login-right p {
            font-size: 16px;
            max-width: 300px;
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }

            .login-right {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="login-left">
        <img src="https://img.icons8.com/ios-filled/100/user.png" class="icon" alt="User Icon">
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <a href="#">Forgot Password ?</a>
            <button type="submit">Login</button>
        </form>
    </div>
    <div class="login-right">
        <img src="{% static 'img/motor.png' %}" alt="Motor Ilustrasi">
        <h2>Edukatif dan Tegas</h2>
        <p>“Bersama Kita Jaga Keselamatan di Jalan!”<br>Masuk untuk memantau dan menciptakan lalu lintas yang lebih aman.</p>
    </div>
</body>
</html>
