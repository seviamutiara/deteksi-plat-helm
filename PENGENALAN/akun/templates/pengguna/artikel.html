{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Artikel Edukasi - Kamera Pintar</title>
    <link rel="stylesheet" href="{% static 'main/rambu.css' %}">
</head>
<body>
    <header class="navbar">
        <div class="logo">Kamera Pintar</div>
        <nav>
            <a href="{% url 'home' %}">Dashboard</a>
            <a href="{% url 'pelanggaran' %}">Pelanggaran</a>
            <a href="#">Logout</a>
        </nav>
    </header>

    <h1>Artikel Edukasi</h1>
    <ul>
        {% for artikel in artikel_list %}
        <li><strong>{{ artikel.judul }}</strong> - oleh {{ artikel.penulis }}, {{ artikel.tanggal }}</li>
        {% endfor %}
    </ul>

    <a href="{% url 'home' %}">Kembali ke Home</a>
</body>
</html>
